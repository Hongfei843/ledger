name: Build unsigned IPA

# 用法：Actions 页面 → 左侧 "Build unsigned IPA" → Run workflow。
# 产物：该次运行页面底部 Artifacts → Ledger-unsigned-ipa（解压即 .ipa）
# 说明：产出的是「未签名」IPA，需要你在本地用 Sideloadly / SideStore 重签后安装。
#
# 工程由 project.yml + XcodeGen 生成（不手写 .xcodeproj，避免格式错误）。
#
# 2026-11 起只在 workflow_dispatch 触发：push 不再自动跑，避免每次推送产生两份排队。
# macOS 托管 runner 容量紧张时，job 会排队约 15 分钟后在 0 步执行的情况下被 cancelled，
# 这不是编译失败：用 .gh/retry-ci.ps1 自动重放，或换 runner 标签（inputs.runner）。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner 标签：macos-15-intel（Intel 池，2026-11 实测能拿到，默认）/ macos-15（arm64 标准池，容量紧张）/ macos-26 / xcode-27-arm64。别写 macos-15-arm64 这类镜像目录名"
        required: false
        default: macos-15-intel
        type: string

jobs:
  build:
    # 标准 macOS 托管 runner 的合法标签（见 actions/runner-images README）：
    #   macos-15-intel  = macOS 15 x64（Intel 池；2026-11-25 实测可用，设为默认）
    #   macos-15        = macOS 15 arm64（2026-11 容量长期紧张，经常排队后被取消）
    #   macos-26        = macOS 26 arm64（= macos-latest）
    #   xcode-27-arm64  = macOS 27 + Xcode 27 预览
    # 不要用 macos-15-arm64 / macos-26-arm64 —— 那是镜像目录名，标签不存在，job 会永远排队。
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        shell: bash
        run: |
          uname -m
          sw_vers
          echo "runner=${{ inputs.runner }}"

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "${LATEST:-}" ]; then
            echo "使用 $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          ls -la
          ls -la Ledger.xcodeproj || true

      - name: Build unsigned IPA
        shell: bash
        env:
          # 每次构建版本号递增，避免装机后分不清是哪一版
          MARKETING_VERSION: "1.0.${{ github.run_number }}"
          CURRENT_PROJECT_VERSION: "${{ github.run_number }}"
        run: |
          set -euo pipefail
          chmod +x scripts/build-ipa.sh
          bash scripts/build-ipa.sh

      # 真正跑一遍单测：金额与摊销算错比编译不过更可怕
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # 取 iOS 18+ 的可用 iPhone；deployment target 是 18.0，旧 runtime 会导致假失败。
          DEVICE_ID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS-' not in runtime:
                  continue
              tail = runtime.rsplit('iOS-', 1)[1]
              nums = [int(x) for x in tail.split('-') if x.isdigit()]
              major = nums[0] if nums else 0
              if major < 18:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      candidates.append((major, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('ERROR: 没有可用的 iOS 18+ iPhone 模拟器')
          candidates.sort(key=lambda x: (-x[0], x[1]))
          print(candidates[0][2])
          PY
          )
          test -n "$DEVICE_ID" || { echo "ERROR: 未取得模拟器 ID"; exit 1; }
          echo "使用模拟器: $DEVICE_ID"
          xcodebuild test \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/Ledger-unsigned.ipa
          ls -lh dist/Ledger-unsigned.ipa
          unzip -l dist/Ledger-unsigned.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          # 产物名带构建版本号，避免多次构建的 zip 在 Actions 页面里分不清先后
          name: Ledger-1.0.${{ github.run_number }}-unsigned-ipa
          path: dist/Ledger-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
